name: token-check

# 토큰이 어느 인스타 계정에 연결됐는지 확인 (게시·수정 없음)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/token-check.yml", "scripts/token_check.py"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 토큰 확인 (값은 출력하지 않음)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/token_check.py
