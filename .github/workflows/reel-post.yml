name: reel-post

# 월·수·금 20:00 KST 릴스 1편 (reels/ 대기열 순서대로). 정시 실행은 Claude 예약 작업, cron은 예비
on:
  schedule:
    - cron: "52 10 * * 1,3,5"
    - cron: "7 11 * * 1,3,5"
    - cron: "27 11 * * 1,3,5"
    - cron: "57 11 * * 1,3,5"
    - cron: "37 12 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency: instagram-post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 오늘 이미 올렸는지 확인
        id: guard
        run: |
          git pull -q origin main
          python3 guard.py >> "$GITHUB_OUTPUT"

      - name: 다음 편
        if: steps.guard.outputs.skip != '1'
        id: pick
        run: |
          D=$(python3 publish.py next)
          if [ -z "$D" ]; then echo "::warning::대기열이 비었어요 (reels/ 폴더에 새 편 추가)"; fi
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: 릴스 게시
        if: steps.pick.outputs.dir != ''
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          export IMAGE_BASE="https://cdn.jsdelivr.net/gh/${{ github.repository }}@$(git rev-parse HEAD)"
          python3 publish.py reel ${{ steps.pick.outputs.dir }}
          git config user.name "haesol-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "published ${{ steps.pick.outputs.dir }}"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done

      - name: 댓글 DM 확인 시작
        if: steps.pick.outputs.dir != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(python3 dm_active.py)" = "1" ]; then gh workflow run dm.yml -R ${{ github.repository }} -f test=0; fi
